---
- name: Deploy HTTP Server Projeto Korp
  hosts: projeto_korp
  connection: local
  become: false

  tasks:
    - name: Verificar se o Docker esta instalado
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Exibir versao do Docker
      debug:
        var: docker_version.stdout

    - name: Verificar se o Docker Compose esta instalado
      command: docker-compose --version
      register: compose_version
      changed_when: false

    - name: Exibir versao do Docker Compose
      debug:
        var: compose_version.stdout

    - name: Verificar configuracao do Docker Compose
      command: docker-compose config
      args:
        chdir: /root/http-server-projeto-korp
      changed_when: false

    - name: Subir aplicacao com Docker Compose
      command: docker-compose up -d --build
      args:
        chdir: /root/http-server-projeto-korp
      register: compose_up

    - name: Exibir resultado do deploy
      debug:
        var: compose_up.stdout

    - name: Verificar containers em execucao
      command: docker ps
      register: docker_ps
      changed_when: false

    - name: Exibir containers
      debug:
        var: docker_ps.stdout_lines
