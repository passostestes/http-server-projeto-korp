services:
  http-server-projeto-korp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: http-server-projeto-korp
    expose:
      - "8080"
    networks:
      - projeto-korp-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-projeto-korp
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - http-server-projeto-korp
    networks:
      - projeto-korp-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-projeto-korp
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - http-server-projeto-korp
    networks:
      - projeto-korp-network
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: grafana-projeto-korp
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - projeto-korp-network
    restart: unless-stopped

networks:
  projeto-korp-network:
    external: true

volumes:
  grafana-data:
